<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Symposium | Stirling Hunt House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#103B31;color:#F6F2E8;font-family:'EB Garamond',serif}
.wrap{max-width:900px;margin:60px auto;padding:20px}
.card{background:#18483A;border:1px solid #B8912D;border-radius:14px;padding:24px;margin:24px 0}
input,select,textarea,button{width:100%;padding:12px;margin:8px 0;font-family:inherit}
button{background:#D4AF37;border:none;cursor:pointer}
</style></head>
<body><div class="wrap">
<h1>Stirling Hunt House</h1><h2>Symposium</h2>
<div class="card">
<input id="title" placeholder="Title">
<select id="subject"><option>Political</option><option>Military</option><option>Economic</option><option>Social</option><option>Information</option><option>Infrastructure</option><option>Cyber</option><option>Industry</option></select>
<textarea id="message" placeholder="Discussion"></textarea>
<button id="publishBtn">Publish</button>
</div>
<div class="card"><h3>Current Discussions</h3><div id="discussionList"></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabase=window.supabase.createClient(
"https://ayvcbbgtlzxifjxahjul.supabase.co",
"sb_publishable_rrOHc1sQEbF2B99zbBbLSg_c9if1TXv");
async function load(){
 const {data,error}=await supabase.from("common_room").select("*").order("id",{ascending:false});
 const el=document.getElementById("discussionList");
 if(error){el.textContent=error.message;return;}
 el.innerHTML=(data||[]).map(d=>`<div class='card'><h3>${d.Title??d.title}</h3><p><em>${d.Subject??d.subject}</em></p><p>${d.Message??d.message}</p></div>`).join("");
}
document.getElementById("publishBtn").onclick=async()=>{
 const payload={Title:title.value,Subject:subject.value,Message:message.value,Replies:0};
 const {error}=await supabase.from("common_room").insert(payload);
 if(error){alert(error.message);return;}
 title.value="";message.value="";load();
};
load();
</script></body></html>
