<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fellows' Portal | Stirling Hunt House</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<nav>

<div class="logo-text">
STIRLING HUNT HOUSE
</div>

<ul>

<li><a href="index.html">Home</a></li>

<li><a href="publications.html">Journal</a></li>

</ul>

</nav>

<header class="hero">

<h1>FELLOWS' PORTAL</h1>

<h2>Stirling Hunt House</h2>

<p class="subtitle">

Access is restricted to Fellows of the Society.

</p>

<input
type="email"
id="email"
placeholder="Email address">

<br><br>

<input
type="password"
id="password"
placeholder="Password">

<br><br>

<button
class="button"
id="loginButton">

Sign In

</button>

<p id="message"></p>

</header>

<script>

const SUPABASE_URL =
"https://ayvcbbgtlzxifjxahjul.supabase.co";

const SUPABASE_KEY =
"sb_publishable_gcRaPoqR2m0_BDTlLzXpDg_MYCyJcvC";

const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const loginButton = document.getElementById("loginButton");
const message = document.getElementById("message");

loginButton.addEventListener("click", signIn);

async function signIn() {

    message.textContent = "";

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    if (!email || !password) {

        message.textContent =
        "Please enter your email and password.";

        return;

    }

    loginButton.disabled = true;
    loginButton.textContent = "Signing In...";

    try {

        const { data, error } =
        await supabase.auth.signInWithPassword({

            email: email,
            password: password

        });

        if (error) {

            message.textContent = error.message;

            loginButton.disabled = false;
            loginButton.textContent = "Sign In";

            return;

        }

        window.location.href = "portal.html";

    }

    catch(err){

        console.error(err);

        message.textContent =
        "Unable to connect to Stirling Hunt House.";

        loginButton.disabled = false;
        loginButton.textContent = "Sign In";

    }

}

</script>

</body>

</html>
