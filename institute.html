<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fellows' Portal | Stirling Hunt House</title>

<link rel="stylesheet" href="style.css">

<!-- Temporary debugging -->

<script>

alert("JavaScript is running");

</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

alert(typeof window.supabase);

</script>

</head>

<body>

<nav>

<div class="logo-text">

STIRLING HUNT HOUSE

</div>

<ul>

<li>
<a href="index.html">
Home
</a>
</li>

<li>
<a href="publications.html">
Journal
</a>
</li>

</ul>

</nav>

<header class="hero">

<h1>

FELLOWS' PORTAL

</h1>

<h2>

Stirling Hunt House

</h2>

<p class="subtitle">

Access is restricted to Fellows of the Society.

</p>

<div id="greeting"></div>

<div id="quotation"></div>

<br>

<input

type="email"

id="email"

placeholder="Email Address"

autocomplete="email">

<br><br>

<input

type="password"

id="password"

placeholder="Password"

autocomplete="current-password">

<br>

<label style="display:block;margin-top:12px;cursor:pointer;">

<input
type="checkbox"
id="showPassword">

 Show Password

</label>

<br>

<button

class="button"

id="loginButton">

Sign In

</button>

<p id="message"></p>

<p style="margin-top:20px;">

<a href="#" id="forgotPassword">

Forgotten your password?

</a>

</p>

<div id="status"></div>


<script>

const SUPABASE_URL =
"https://ayvcbbgtlzxifjxahjul.supabase.co";

const SUPABASE_KEY =
"sb_publishable_gcRaPoqR2m0_BDTlLzXpDg_MYCyJcvC";

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);
alert("Supabase client created successfully.");
const loginButton =
document.getElementById("loginButton");

const message =
document.getElementById("message");

const status =
document.getElementById("status");

const greeting =
document.getElementById("greeting");

const quotation =
document.getElementById("quotation");

/* ---------- Greeting ---------- */

const hour = new Date().getHours();

if(hour < 12){

greeting.innerHTML =
"<p style='color:#D4AF37;font-style:italic;'>Good Morning, Fellow.</p>";

}else if(hour < 18){

greeting.innerHTML =
"<p style='color:#D4AF37;font-style:italic;'>Good Afternoon, Fellow.</p>";

}else{

greeting.innerHTML =
"<p style='color:#D4AF37;font-style:italic;'>Good Evening, Fellow.</p>";

}

/* ---------- Rotating Quotations ---------- */

const quotes = [

"Truth emerges through disciplined inquiry.",

"Knowledge shared with integrity strengthens the Fellowship.",

"Civilisation advances through thoughtful discourse.",

"Wisdom begins where certainty ends.",

"Scholarship in service of society.",

"Reason before certainty.",

"Question deeply. Conclude carefully.",

"Veritatem Quaerere."

];

let quoteIndex = 0;

function rotateQuote(){

quotation.innerHTML =

"<p style='font-style:italic;color:#D9CDAA;margin-bottom:20px;'>"

+ quotes[quoteIndex] +

"</p>";

quoteIndex++;

if(quoteIndex >= quotes.length){

quoteIndex = 0;

}

}

rotateQuote();

setInterval(
rotateQuote,
7000
);

/* ---------- Show Password ---------- */

document
.getElementById("showPassword")
.addEventListener("change",function(){

document
.getElementById("password")
.type = this.checked ? "text" : "password";

});

/* ---------- Forgotten Password ---------- */

document
.getElementById("forgotPassword")
.addEventListener("click",async function(e){

e.preventDefault();

const email =
document
.getElementById("email")
.value
.trim();

if(email===""){

alert(
"Please enter your email address first."
);

return;

}

const { error } =

await supabase
.auth
.resetPasswordForEmail(email,{

redirectTo:
"https://hamesjarris989-source.github.io/Stirling-Hunt-House/reset-password.html"

});

if(error){

alert(error.message);

}else{

alert(
"If an account exists, a password reset email has been sent."
);

}

});

/* ---------- Login ---------- */

loginButton.addEventListener(
"click",
signIn
);

async function signIn(){

message.textContent = "";

status.textContent =
"Authenticating Fellow...";

const email =
document
.getElementById("email")
.value
.trim();

const password =
document
.getElementById("password")
.value;

if(email==="" || password===""){

alert(
"Please enter your email and password."
);

message.textContent =
"Please enter your email and password.";

status.textContent = "";

return;

}

loginButton.disabled = true;

loginButton.textContent =
"Signing In...";

        try{

            const { data, error } =
            await supabase.auth.signInWithPassword({

                email: email,
                password: password

            });

            console.log("DATA:", data);
            console.log("ERROR:", error);

            if(error){

                alert(error.message);

                message.textContent = error.message;

                status.textContent = "Authentication failed.";

                loginButton.disabled = false;

                loginButton.textContent = "Sign In";

                return;

            }

            status.textContent =
            "Authentication successful.";

            alert("Welcome, Fellow.");

            window.location.href = "portal.html";

        }

        catch(err){

            console.error(err);

            alert(err.message);

            message.textContent =
            "Unable to connect to Stirling Hunt House.";

            status.textContent =
            "Unable to contact authentication server.";

            loginButton.disabled = false;

            loginButton.textContent = "Sign In";

        }

}

/* ---------- Security Notice ---------- */

const security =
document.createElement("p");

security.style.marginTop = "60px";
security.style.textAlign = "center";
security.style.color = "#AFA58A";
security.style.fontSize = "15px";

security.textContent =
"Authorised Fellows only • All access is logged.";

document.body.appendChild(security);

</script>

</body>

</html>
