/* ---------- Forgotten Password ---------- */

const email =

if(email===""){

alert(

/* ---------- Time Greeting ---------- */

const greeting =
document.createElement("p");

greeting.style.marginTop = "30px";

greeting.style.color = "#D4AF37";
greeting.style.fontSize = "20px";

/* ---------- Rotating Institute Quotations ---------- */

const quotations = [

"Truth emerges through disciplined inquiry.",

},500);

setInterval(
