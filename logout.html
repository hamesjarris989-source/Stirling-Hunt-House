<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Signing Out | Stirling Hunt House</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header class="hero">
    <h1>Signing Out...</h1>
    <p class="subtitle">
        Please wait while your secure session is ended.
    </p>
</header>

<script>
const supabase = window.supabase.createClient(
    "https://ayvcbbgtlzxifjxahjul.supabase.co",
    "sb_publishable_rrOHc1sQEbF2B99zbBbLSg_c9if1TXv"
);

async function logout() {

    try {

        // Sign the user out
        await supabase.auth.signOut();

        // Clear any cached auth data
        localStorage.clear();
        sessionStorage.clear();

        // Prevent the browser back button restoring the page
        history.replaceState(null, "", "login.html");

        // Go back to login page
        window.location.replace("login.html");

    } catch (err) {

        console.error(err);

        alert("Unable to sign out. Please try again.");

        window.location.replace("login.html");
    }
}

logout();
</script>

</body>
</html>
