async function checkUser() {

        alert("Session error:");
        alert(error.message);

        console.error(error);

        window.location.href = "institute.html";

        return;

    }

    if (!data.session) {

        alert("No active session found.");

        window.location.href = "institute.html";

        return;

    }

    alert("✓ Active session found");

    console.log(data.session);

}
